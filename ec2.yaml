AWSTemplateFormatVersion: "2010-09-09" 

Description: This template creates a simple EC2 instance with a security group that allows SSH access. 

Parameters:
  InstanceType:
    Description: The type of EC2 instance to create
    Type: String
    Default: t2.micro
    AllowedValues:
     - t2.micro
     - t2.small
     - t2.medium
    Description: Must be a valid EC2 instance type.

     KeyName:
      Type: AWS::EC2::KeyPair::KeyName
      Description: Name of an existing EC2 KeyPair to enable SSH access to the instance

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c55b159cbfafe1f0 # Amazon Linux 2 AMI (HVM), SSD Volume Type
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
       
      Tags:
       -Key: Name
       Value: MyFirstCloudFormationEC2 
Outputs:
  InstanceId:
    Description: The Instance ID of the newly created EC2 instance
    Value: !Ref MyEC2Instance
  PublicIP:
    Description: The public IP address of the newly created EC2 instance
    Value: !GetAtt MyEC2Instance.PublicIp