AWSTemplateFormatVersion: '2010-09-09'
# ↑ Version of CloudFormation (like API version)

Description: Create EC2 Instance with Security Group
# ↑ Human-readable description of what this does

Parameters:
  # ↓ Parameters = Variables that users can change when deploying
  InstanceType:
    Type: String
    Default: t3.micro
    # ↑ Default to t3.micro (Free Tier eligible in Mumbai region)
    AllowedValues:
      - t3.micro   # Smallest, Free Tier
      - t3.small   # Small, costs money
      - t3.medium  # Medium, costs more
    Description: EC2 instance type

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    # ↑ Must be an existing SSH key pair
    Description: Name of an existing EC2 KeyPair

  AMIId:
    Type: AWS::EC2::Image::Id
    # ↑ AMI = Amazon Machine Image (Operating System template)
    Description: AMI ID for the EC2 instance

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev      # Development
      - staging  # Testing
      - prod     # Production
    Description: Environment name

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    # ↑ Allow SSH from anywhere (for learning)
    # ⚠️ For production, restrict to your IP only!
    Description: IP range for SSH access

Resources:
  # ↓ Resources = What we're actually creating

  # === SECURITY GROUP (Firewall) ===
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    # ↑ Creates a virtual firewall
    Properties:
      GroupDescription: Allow SSH and HTTP access
      SecurityGroupIngress:  # Incoming traffic rules
        - IpProtocol: tcp
          FromPort: 22        # SSH port
          ToPort: 22
          CidrIp: !Ref SSHLocation  # Allow SSH from specified IP
        - IpProtocol: tcp
          FromPort: 80        # HTTP port
          ToPort: 80
          CidrIp: 0.0.0.0/0   # Allow HTTP from anywhere
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-ec2-sg"
          # ↑ Names the security group like "dev-ec2-sg"
        - Key: Environment
          Value: !Ref Environment

  # === EC2 INSTANCE (Virtual Server) ===
  MyEC2Instance:
    Type: AWS::EC2::Instance
    # ↑ Creates the actual virtual server
    Properties:
      ImageId: !Ref AMIId
      # ↑ Which operating system to install
      InstanceType: !Ref InstanceType
      # ↑ How powerful the server should be
      KeyName: !Ref KeyName
      # ↑ Which SSH key to use for access
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
        # ↑ Attach the firewall we created
      
      UserData:
        # ↓ Script that runs when server starts
        Fn::Base64: !Sub |
          #!/bin/bash
          # ↑ This is like a startup script
          yum update -y
          # ↑ Update all system packages
          yum install -y httpd
          # ↑ Install Apache web server
          systemctl start httpd
          # ↑ Start the web server
          systemctl enable httpd
          # ↑ Make it start automatically on boot
          echo "<h1>Welcome to ${Environment} Environment</h1>" > /var/www/html/index.html
          # ↑ Create a simple web page
          echo "<p>Deployed via Jenkins Pipeline</p>" >> /var/www/html/index.html
      
      Tags:
        # ↓ Labels to identify the instance
        - Key: Name
          Value: !Sub "${Environment}-ec2-instance"
        - Key: Environment
          Value: !Ref Environment
        - Key: CreatedBy
          Value: Jenkins

Outputs:
  # ↓ Information we want to see after creation
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref MyEC2Instance
    # ↑ Gets the unique ID of the instance

  PublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt MyEC2Instance.PublicIp
    # ↑ Gets the public IP address

  PublicDNS:
    Description: Public DNS of the EC2 instance
    Value: !GetAtt MyEC2Instance.PublicDnsName
    # ↑ Gets the public DNS name

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref InstanceSecurityGroup
