AWSTemplateFormatVersion: '2010-09-09'
# ↑ Version of CloudFormation (like API version)

Description: Create EC2 Instance with Security Group - Ubuntu in Mumbai (ap-south-1)
# ↑ Human-readable description of what this does

Parameters:
  # ↓ Parameters = Variables that users can change when deploying
  InstanceType:
    Type: String
    Default: t3.micro
    # ↑ Default to t3.micro (Free Tier eligible in Mumbai region)
    AllowedValues:
      - t3.micro   # Smallest, Free Tier
      - t3.small   # Small, costs money
      - t3.medium  # Medium, costs more
    Description: EC2 instance type

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    # ↑ Must be an existing SSH key pair
    Description: Name of an existing EC2 KeyPair

  AMIId:
    Type: AWS::EC2::Image::Id
    # ↑ AMI = Amazon Machine Image (Operating System template)
    Description: AMI ID for the EC2 instance (Ubuntu in Mumbai)
    Default: ami-0c2af51e265bd5e0e
    # ↑ Ubuntu 22.04 LTS in Mumbai (ap-south-1) region
    # Alternative Ubuntu 24.04 LTS: ami-09923e7fc8d31ddbc

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev      # Development
      - staging  # Testing
      - prod     # Production
    Description: Environment name

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    # ↑ Allow SSH from anywhere (for learning)
    # ⚠️ For production, restrict to your IP only!
    Description: IP range for SSH access

Resources:
  # ↓ Resources = What we're actually creating

  # === SECURITY GROUP (Firewall) ===
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    # ↑ Creates a virtual firewall
    Properties:
      GroupDescription: Allow SSH and HTTP access
      SecurityGroupIngress:  # Incoming traffic rules
        - IpProtocol: tcp
          FromPort: 22        # SSH port
          ToPort: 22
          CidrIp: !Ref SSHLocation  # Allow SSH from specified IP
        - IpProtocol: tcp
          FromPort: 80        # HTTP port
          ToPort: 80
          CidrIp: 0.0.0.0/0   # Allow HTTP from anywhere
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-ec2-sg"
          # ↑ Names the security group like "dev-ec2-sg"
        - Key: Environment
          Value: !Ref Environment

  # === EC2 INSTANCE (Virtual Server) ===
  MyEC2Instance:
    Type: AWS::EC2::Instance
    # ↑ Creates the actual virtual server
    Properties:
      ImageId: !Ref AMIId
      # ↑ Which operating system to install (Ubuntu)
      InstanceType: !Ref InstanceType
      # ↑ How powerful the server should be
      KeyName: !Ref KeyName
      # ↑ Which SSH key to use for access
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
        # ↑ Attach the firewall we created
      
      UserData:
        # ↓ Script that runs when server starts
        Fn::Base64: !Sub |
          #!/bin/bash
          # ↑ This is like a startup script
          
          # 🔄 UBUNTU SPECIFIC COMMANDS (not yum!)
          apt-get update -y
          # ↑ Update all system packages (apt-get for Ubuntu)
          
          apt-get install -y apache2
          # ↑ Install Apache web server (called apache2 on Ubuntu)
          
          systemctl start apache2
          # ↑ Start the web server
          
          systemctl enable apache2
          # ↑ Make it start automatically on boot
          
          # Create a simple web page
          echo "<h1>Welcome to ${Environment} Environment</h1>" > /var/www/html/index.html
          echo "<p>Deployed via Jenkins Pipeline on Ubuntu</p>" >> /var/www/html/index.html
          echo "<p>Region: Mumbai (ap-south-1)</p>" >> /var/www/html/index.html
          echo "<p>Instance Type: ${InstanceType}</p>" >> /var/www/html/index.html
          
          # Optional: Install additional useful packages
          apt-get install -y curl wget git vim
      
      Tags:
        # ↓ Labels to identify the instance
        - Key: Name
          Value: !Sub "${Environment}-ubuntu-instance"
        - Key: Environment
          Value: !Ref Environment
        - Key: CreatedBy
          Value: Jenkins
        - Key: OS
          Value: Ubuntu-22.04
        - Key: Region
          Value: ap-south-1

Outputs:
  # ↓ Information we want to see after creation
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref MyEC2Instance
    # ↑ Gets the unique ID of the instance

  PublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt MyEC2Instance.PublicIp
    # ↑ Gets the public IP address

  PublicDNS:
    Description: Public DNS of the EC2 instance
    Value: !GetAtt MyEC2Instance.PublicDnsName
    # ↑ Gets the public DNS name

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref InstanceSecurityGroup

  SSHCommand:
    Description: SSH command to connect to Ubuntu instance
    Value: !Sub "ssh -i ${KeyName}.pem ubuntu@${MyEC2Instance.PublicIp}"
    # ⚠️ Note: Ubuntu uses 'ubuntu' user, NOT 'ec2-user'!

  WebURL:
    Description: Web server URL
    Value: !Sub "http://${MyEC2Instance.PublicIp}"